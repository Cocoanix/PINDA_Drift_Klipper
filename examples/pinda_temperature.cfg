# Example measured on Cocoanix Printer One with a 140 C nozzle during probing.
# The printer used [temperature_sensor probe_temp] with an
# EPCOS 100K B57560G104F thermistor on PA0. Use your own sensor configuration.
# The final [probe] z_offset was 2.300 mm at the reference temperature.
# Set your own base z_offset and drift points before enabling compensation.
[pinda_temperature]
sensor: temperature_sensor probe_temp
enabled: False
reference_temperature: 34.825876
interpolation: linear
scale: 1.0
max_adjustment: 1.0
out_of_range: error
range_margin: 0.5
stability_time: 60
stability_tolerance: 0.3
stability_min_time: 180
warmup_timeout: 900
points:
    34.825876, 0.000000
    37.643262, 0.250000
    42.095369, 0.750000
