# Prusa MK3 PINDA factory points, documented in the firmware's M861 ! handler.
# The example uses a cubic spline within the table and stops probing outside it.
# Validate the offsets on your printer before enabling compensation.
[pinda_temperature]
sensor: temperature_sensor probe_temp
enabled: False
reference_temperature: 35.0
interpolation: cubic
scale: 1.0
max_adjustment: 0.5
out_of_range: error
range_margin: 0.0
stability_time: 60
stability_tolerance: 0.3
stability_min_time: 180
warmup_timeout: 900
points:
    35.0, 0.000
    40.0, 0.020
    45.0, 0.060
    50.0, 0.120
    55.0, 0.200
    60.0, 0.300
